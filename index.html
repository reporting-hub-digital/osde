<!DOCTYPE html>
<html lang="es"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reporte de medios · LSIX</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&amp;display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script>try{if(localStorage.getItem('dksTema')==='dark')document.documentElement.classList.add('dark')}catch(e){}</script>
<style>
:root{
  --blue:#001489; --btn:#001489; --ink:#001489; --pink:#d8456b; --pinkbg:#fdf0f4; --bg:#f9fafb; --surface:#ffffff; --text:#1f2937; --muted:#6b7280; --faint:#9ca3af;
  --line:#e5e7eb; --line2:#f3f4f6; --edge:#d1d5db; --soft:#eef0f8; --gray100:#f3f4f6;
  --th:#001489; --heat:rgba(0,20,137,.13); --pos:#16a34a; --neg:#dc2626; --neu:#6b7280;
  --info-bg:#eff6ff; --info-bd:#dbeafe; --info-tx:#1e40af;
  --shadow:0 1px 2px rgba(0,0,0,.05);
  --t-meta:#cfe6fd; --t-google:#fdf0c6; --t-tiktok:#e3e3ea; --t-dv360:#d3efd8;
  --c-meta:#1877f2; --c-google:#e0a000; --c-tiktok:#ee1d52; --c-dv360:#1e8e3e;
}
html.dark{
  --ink:#8d9bff; --btn:#2f3fd1; --pink:#ff7da1; --pinkbg:#3a2330; --bg:#0f1220; --surface:#1a1e33; --text:#e5e7eb; --muted:#9ca3af; --faint:#8b93a7;
  --line:#2d3354; --line2:#2d3354; --edge:#2d3354; --soft:#232a4d; --gray100:#262b45;
  --th:#0b1060; --heat:rgba(141,155,255,.24); --pos:#4ade80; --neg:#f87171; --neu:#9ca3af;
  --info-bg:#1b2347; --info-bd:#2d3354; --info-tx:#aab6ff;
  --t-meta:#173258; --t-google:#4a3b12; --t-tiktok:#2b2d3d; --t-dv360:#16432a;
  --c-meta:#5aa2ff; --c-google:#ffc233; --c-tiktok:#ff5c83; --c-dv360:#4cd17a;
  --shadow:none;
}
*{box-sizing:border-box}
html{color-scheme:light}html.dark{color-scheme:dark}
body{margin:0;background:var(--bg);color:var(--text);font:14px/1.5 'Inter',system-ui,sans-serif;font-variant-numeric:tabular-nums;padding-bottom:48px}
.hidden{display:none!important}
.disp{font-weight:700}
.muted{color:var(--muted)}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}

/* Header + pestañas (misma base que los tableros DKS) */
.stick{position:sticky;top:0;z-index:40;background:var(--surface);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.top{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:12px;padding:16px 24px;border-bottom:1px solid var(--line)}
.hl{display:flex;align-items:center;gap:24px;flex-wrap:wrap}
.hl>img{height:56px;object-fit:contain;display:block}
.hdiv{border-left:2px solid var(--edge);padding-left:24px;display:flex;align-items:center;gap:16px}
.hdiv img{height:40px;max-width:150px;object-fit:contain}
.hdiv h1{margin:0;font-size:24px;font-weight:700;text-transform:uppercase;letter-spacing:.025em;line-height:1.15}
#campaignInfo{font-size:14px;color:var(--muted);font-weight:500;margin:0}
html.dark .hl>img,html.dark .hdiv img{filter:brightness(0) invert(1)}
.hr{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.pill{border:1px solid var(--edge);background:var(--surface);color:var(--text);border-radius:999px;padding:4px 12px;font-size:14px;font-weight:600}
button.pill:hover{background:var(--bg)}
.pill-date{background:var(--gray100);color:var(--faint);border-radius:999px;padding:4px 12px;font-size:14px;font-weight:600}
.tabbar{padding:0 24px}
.tabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:0 0 auto;background:transparent;border:0;border-bottom:3px solid transparent;color:var(--muted);padding:12px 18px;font-size:14px;font-weight:600;white-space:nowrap}
.tab:hover{color:var(--ink)}
.tab[aria-selected=true]{color:var(--ink);border-bottom-color:var(--pink)}
.tab i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:8px;vertical-align:0}
@media (max-height:700px){.stick{position:static}}

/* Filters */
.filters{max-width:1352px;width:calc(100% - 48px);margin:20px auto 0;background:var(--surface);border:1px solid var(--line2);border-radius:12px;box-shadow:var(--shadow);padding:16px;display:grid;gap:12px}
.frow{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.flabel{font-size:14px;font-weight:700;color:var(--ink);text-transform:uppercase;letter-spacing:.05em;min-width:72px}
.chip{border:1px solid var(--edge);background:var(--surface);color:var(--text);border-radius:8px;padding:8px 12px;font-size:12px;font-weight:600}
.chip:hover{background:var(--bg)}
.chip[aria-pressed=true]{background:var(--btn);border-color:var(--btn);color:#fff}
.fin{border:1px solid var(--edge);background:var(--surface);border-radius:8px;padding:8px;font-size:14px}
.fnote{font-size:12px;color:var(--faint)}

/* Layout */
main{max-width:1400px;margin:0 auto;padding:12px 28px 56px}
.sec-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin:22px 0 10px}
.sec-head h2{margin:0;font-size:28px;color:var(--ink);line-height:1}
.grid2{align-items:start;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}
.grid21{display:grid;grid-template-columns:minmax(0,3fr) minmax(0,2fr);gap:18px}
.kgrid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow)}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 16px 4px}
.card-h h3{margin:0;font-size:22px;color:var(--ink);line-height:1}
.card-b{padding:10px 16px 16px}

/* KPI */
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 12px 10px;text-align:center}
.kpi .l{font-size:12px;font-weight:700;color:var(--ink)}
.kpi .v{white-space:nowrap;font-size:26px;font-weight:500;color:var(--text);margin:4px 0 2px;line-height:1.15;letter-spacing:-.01em}
.kpi .v.nd{font-size:15px;color:var(--muted);font-weight:500;line-height:2.15}
.kpi .d{font-size:11.5px;font-weight:600;min-height:16px}
.d.pos{color:var(--pos)}.d.neg{color:var(--neg)}.d.neu,.d.none{color:var(--neu)}.d.none{font-weight:400}
.kpi.big .v{font-size:32px;font-weight:600;color:var(--ink)}
.kpi .sub{font-size:11px;color:var(--muted)}

/* Platform tint */
.tint{border-radius:12px 12px 0 0}
.tint-meta{background:var(--t-meta)}.tint-google{background:var(--t-google)}.tint-tiktok{background:var(--t-tiktok)}.tint-dv360{background:var(--t-dv360)}
.pcard{overflow:hidden}
.pcard .ph{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 16px;flex-wrap:wrap}
.pname{display:flex;align-items:center;gap:8px;font-size:30px;line-height:1;color:var(--text)}
.pname i{width:14px;height:14px;border-radius:50%;display:inline-block}
.pcard .pb{padding:14px 16px 16px;display:grid;gap:14px}
.pcard .kk{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.pfoot{display:flex;align-items:center;justify-content:space-between;gap:10px;border-top:1px dashed var(--line);padding-top:10px;flex-wrap:wrap}
.pfoot b{font-size:15px}
.golink{border:0;background:transparent;color:var(--ink);font-weight:700;font-size:13px;padding:4px 0}
.golink:hover{text-decoration:underline}
select.sel{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 28px 6px 10px;max-width:260px;min-width:150px}

/* Platform band */
.pband{display:grid;grid-template-columns:minmax(220px,300px) 1fr;gap:18px;padding:16px 18px;align-items:center}
.pband .kk{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.pband .note{grid-column:1/-1;font-size:12px;color:var(--muted)}
.pband .stack{display:grid;gap:10px}

/* Tables */
.tw{overflow:auto;max-height:440px;border:1px solid var(--line);border-radius:10px}
table{border-collapse:collapse;width:100%;font-size:13px}
th{position:sticky;top:0;background:var(--th);color:#fff;padding:10px 12px;text-align:right;font-weight:600;white-space:nowrap;cursor:pointer;user-select:none;z-index:2}
th:first-child,td:first-child{text-align:left}
th.l,td.l{text-align:left}
td{padding:8px 12px;border-top:1px solid var(--line);text-align:right}
td.name{max-width:380px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
tbody tr:hover td{background:var(--soft)}
tfoot td{position:sticky;bottom:0;background:var(--soft);font-weight:700;border-top:2px solid var(--ink);z-index:1}
td a{color:var(--ink);word-break:break-all;white-space:normal}
td.heat{background-repeat:no-repeat}
.empty{padding:28px;text-align:center;color:var(--muted)}

/* Charts */
.ch{position:relative;height:300px}
.ch.tall{height:340px}
.legend-note{font-size:12px;color:var(--muted)}

/* Admin */
.admin{max-width:1400px;margin:24px auto 0;padding:0 24px}
.apanel{background:var(--surface);padding:24px;border-radius:12px;box-shadow:var(--shadow);border-top:4px solid var(--blue)}
html.dark .apanel{border-top-color:#6c7bff}
.apanel h2{margin:0 0 8px;font-size:18px;font-weight:700;color:var(--ink)}
.info{background:var(--info-bg);border:1px solid var(--info-bd);color:var(--info-tx);font-size:14px;padding:12px;border-radius:6px;margin-bottom:16px;line-height:1.7}
.arow{display:flex;gap:16px;flex-wrap:wrap;align-items:center}
.apanel input[type=text]{flex:1;min-width:260px;border:1px solid var(--edge);background:var(--surface);border-radius:8px;padding:12px;font-size:14px}
.btn{border:1px solid var(--edge);background:var(--surface);color:var(--text);border-radius:8px;padding:12px 16px;font-weight:600;font-size:14px;white-space:nowrap;box-shadow:var(--shadow)}
.btn:hover{background:var(--bg)}
.btn.pri{background:var(--btn);border-color:var(--btn);color:#fff;font-weight:700;padding:12px 24px}
.btn.pri:hover{filter:brightness(1.2)}
.btn.pink{background:#d8456b;border-color:#d8456b;color:#fff;font-weight:700;padding:12px 24px}
.btn.pink:hover{background:#be185d;border-color:#be185d}
#status{font-size:14px;margin-top:12px}
#status.err{color:var(--neg)}#status.ok{color:var(--pos)}

.loading{position:fixed;inset:0;background:color-mix(in srgb,var(--surface) 90%,transparent);z-index:100;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px}
.spin{width:64px;height:64px;border-radius:50%;border:4px solid transparent;border-bottom-color:var(--btn);border-left-color:var(--pink);animation:sp 1s linear infinite;margin-bottom:8px}
.loading b{font-size:20px;color:var(--ink);letter-spacing:-.01em}
@keyframes sp{to{transform:rotate(360deg)}}

@media (max-width:900px){
  .top{padding:12px 16px}.hdiv{padding-left:16px}.hl{gap:16px}
  .tabbar,.admin{padding-left:16px;padding-right:16px}main{padding-left:16px;padding-right:16px}
  .filters{width:calc(100% - 32px)}
  .grid2,.grid21,.pband{grid-template-columns:minmax(0,1fr)}
  .pcard .kk,.pband .kk{grid-template-columns:repeat(2,minmax(0,1fr))}
  .kpi .v{font-size:20px}.kpi.big .v{font-size:22px}
  .ch.tall{height:280px}
  .hdiv h1{font-size:18px}
}
@media print{
  .tabbar,.filters,.admin,.hr,.golink,select.sel{display:none!important}
  body{background:#fff}.card,.kpi{box-shadow:none;break-inside:avoid}
  .view{display:block!important}.tw{max-height:none;overflow:visible}
}

/* Componentes con la identidad de los tableros DKS */
.sec-head h2{font-size:20px;font-weight:700;color:var(--pink);letter-spacing:0}
.card-h h3{font-size:18px;font-weight:700;color:var(--pink)}
.card{border-color:var(--line2)}
.kpi{border:1px solid var(--line2);border-bottom:4px solid var(--blue);border-radius:12px;box-shadow:var(--shadow);padding:18px 10px 14px}
html.dark .kpi{border-bottom-color:#6c7bff}
.kpi .l{font-size:12px;text-transform:uppercase;letter-spacing:.05em;font-weight:700;color:var(--muted)}
.kpi .v{font-weight:700;color:var(--ink);font-size:24px;margin:8px 0 2px}
.kpi.big .v{font-size:26px}
.kpi.k-pink{border-bottom-color:var(--pink)}.kpi.k-pink .v{color:var(--pink)}
.pband .kpi{border-bottom-color:#22c55e}.pband .kpi .v{color:var(--pos)}
.kpi .v.nd{font-size:15px;font-weight:500;color:var(--faint);line-height:2.1}
.pname{font-size:22px;font-weight:700;letter-spacing:-.01em}
.golink{color:var(--ink)}
th{background:var(--th);border-bottom:2px solid var(--pink);font-size:12px;text-transform:uppercase;letter-spacing:.05em;padding:14px 16px}
td{padding:12px 16px}
td.pk{background:var(--pinkbg);font-weight:700;color:var(--pink)}
tfoot td{background:var(--soft);color:var(--ink);border-top:2px solid var(--ink)}
.tw{border-color:var(--line)}
</style>
</head>

/* ============ Normalización de datos ============ */
function headerMap(rows) {
  const hs = rows.length ? Object.keys(rows[0]).filter(h => !h.startsWith('__')) : [];
  const map = {};
  hs.forEach(h => { const k = key(h); for (const c in COLS) if (!map[c] && COLS[c].includes(k)) map[c] = h; });
  return map;
}
function buildRows(raw) {
  const map = headerMap(raw);
  if (!map.fecha || !map.imp) return { rows: [], has: new Set() };
  const rows = [];
  raw.forEach(o => {
    const iso = parseDate(o['__d_' + map.fecha] || o[map.fecha]);
    if (!iso) return;
    const r = { iso, vertical: map.vertical ? String(o[map.vertical] || '').trim() : '', campaign: map.campaign ? String(o[map.campaign] || '').trim() : '(sin campaña)',
                ad: map.ad ? String(o[map.ad] || '').trim() : '', url: map.url ? String(o[map.url] || '').trim() : '' };
    NUMF.forEach(f => { r[f] = map[f] ? parseNum(o[map[f]]) : 0; });
    if (r.imp > 0 || r.clk > 0 || r.cost > 0 || r.conv > 0 || r.inter > 0) rows.push(r);
  });
  return { rows, has: new Set(Object.keys(map)) };
}
function buildConv(raw) {
  const map = headerMap(raw);
  if (!map.fecha || !map.ctype) return [];
  return raw.map(o => ({ iso: parseDate(o['__d_' + map.fecha] || o[map.fecha]), vertical: map.vertical ? String(o[map.vertical] || '').trim() : '',
    campaign: map.campaign ? String(o[map.campaign] || '').trim() : '', type: String(o[map.ctype] || '').trim(), n: parseNum(o[map.conv]) })).filter(r => r.iso && r.type);
}
function buildBudgets(raw) {
  const out = [];
  raw.forEach(o => {
    const g = (names) => { for (const h of Object.keys(o)) if (names.includes(key(h))) return o[h]; return ''; };
    const p = PKEY[key(g(['plataforma','platform']))]; if (!p) return;
    const from = parseDate(g(['inicio','desde','fechainicio'])), to = parseDate(g(['fin','hasta','fechafin'])), amount = parseNum(g(['presupuesto','budget']));
    if (!from || !to || !(amount > 0)) return;
    out.push({ p, vertical: String(g(['vertical']) || '').trim(), campaign: String(g(['campana','campaign']) || '').trim(), from, to, amount });
  });
  return out;
}

  CUR = S.cfg.moneda || '$';
  let any = false;
  PIDS.forEach(p => { const b = buildRows(tabs[PLATS[p].tab] || []); S.rows[p] = b.rows; S.has[p] = b.has; if (b.rows.length) any = true; });
  S.conv = buildConv(tabs.GoogleAds_Conv || []);

  PIDS.forEach(p => S.rows[p].forEach(r => { if (r.iso < min) min = r.iso; if (r.iso > max) max = r.iso; }));

/* ============ Cálculo ============ */

function pick(p, g, o = {}) {
  const c = o.camp === false ? '' : S.camp[p];

}
function agg(rows) {
  const a = { n: rows.length, imp:0, clk:0, reach:0, inter:0, cF:0, cW:0, usr:0, views:0, conv:0, fol:0, cost:0 };
  const days = new Set();

  a.days = days.size; return a;
}

  let tot = 0, any = false;
  S.budgets.forEach(b => {
    if (b.p !== p) return;
    if (S.vert.size && !S.vert.has(b.vertical)) return;
    if (S.camp[p] && b.campaign !== S.camp[p]) return;
    const f = b.from > g.from ? b.from : g.from, t = b.to < g.to ? b.to : g.to;
    if (f > t) return;
    tot += b.amount * (dayDiff(f, t) + 1) / (dayDiff(b.from, b.to) + 1); any = true;

  const cls = inv ? 'neu' : (d >= 0 ? 'pos' : 'neg');

}

  return `<div class="kpi ${o.big ? 'big' : ''} ${m === 'ctr' ? 'k-pink' : ''}"><div class="l">${esc(o.label || M[m].l)}</div>` +
    (v == null ? '<div class="v nd">No hay datos</div><div class="d none">&nbsp;</div>' : `<div class="v">${fmt(v)}</div>${deltaHTML(d, M[m].inv)}`) + '</div>';
}
function rawKpi(label, valueHTML, sub, big) {
  return `<div class="kpi ${big ? 'big' : ''}"><div class="l">${esc(label)}</div><div class="v">${valueHTML}</div>${sub || ''}</div>`;
}

/* Inversión: 4 tarjetas (diaria, consumida, % consumida, restante) con filtro de fechas aplicado */
function costKpis(p, s) {
  const a = s.a, hasCost = available(p, 'cost') && a.n > 0;
  const nd = (l) => `<div class="kpi"><div class="l">${l}</div><div class="v nd">No hay datos</div><div class="d none">&nbsp;</div></div>`;
  if (!hasCost) return [nd('Inversión diaria'), nd('Inversión consumida'), nd('% Inversión consumida'), nd('Inversión restante')].join('');
  const daily = a.days ? a.cost / a.days : 0;
  const pdaily = s.pa.days ? s.pa.cost / s.pa.days : null;
  const dd = (s.hasPrev && pdaily > 0) ? daily / pdaily - 1 : null;
  const dc = (s.hasPrev && s.pa.cost > 0) ? a.cost / s.pa.cost - 1 : null;
  const parts = [
    rawKpi('Inversión diaria', fMon2(daily), deltaHTML(dd, true)),
    rawKpi('Inversión consumida', fMon2(a.cost), deltaHTML(dc, true))
  ];
  if (s.budget > 0) {
    const pct = a.cost / s.budget, rest = s.budget - a.cost;
    parts.push(rawKpi('% Inversión consumida', `${nf2.format(pct * 100)} %`, `<div class="sub">de ${fMon0(s.budget)}</div>`));
    parts.push(rawKpi('Inversión restante', `<span style="${rest < 0 ? 'color:var(--neg)' : ''}">${fMon2(rest)}</span>`, `<div class="sub">${rest < 0 ? 'sobre el presupuesto' : 'del presupuesto del período'}</div>`));
  } else {
    parts.push(rawKpi('% Inversión consumida', '<span class="nd" style="font-size:15px;color:var(--muted)">Sin presupuesto</span>', '<div class="sub">no hay presupuesto para este filtro</div>'));
    parts.push(rawKpi('Inversión restante', '<span class="nd" style="font-size:15px;color:var(--muted)">—</span>', ''));
  }
  return parts.join('');
}

function drawTable(id) {
  const t = TBL[id]; if (!t) return; const el = $(id); if (!el) return;
  let rows = t.rows.slice(); const st = SORT[id];
  if (st) rows.sort((x, y) => { const a = x[st.k], b = y[st.k]; const e = (v) => v == null || v === '';
    if (e(a) || e(b)) return e(a) === e(b) ? 0 : (e(a) ? 1 : -1);
    const r = typeof a === 'number' && typeof b === 'number' ? a - b : String(a).localeCompare(String(b), 'es', { numeric: true });
    return st.dir === 'asc' ? r : -r; });
  if (!rows.length) { el.innerHTML = '<div class="empty">Sin datos para el período y filtros seleccionados.</div>'; return; }
  const max = {}; t.cols.forEach(c => { if (c.heat) max[c.k] = Math.max(...t.rows.map(r => r[c.k] || 0), 1); });
  const head = t.cols.map((c, i) => `<th class="${i === 0 || c.left ? 'l' : ''}" data-tbl="${id}" data-k="${c.k}" title="Click para ordenar">${esc(c.l)}${st && st.k === c.k ? (st.dir === 'asc' ? ' ▲' : ' ▼') : ''}</th>`).join('');
  const cell = (c, r, i) => {
    const v = r[c.k]; let txt;
    if (c.link) txt = v ? `<a href="${esc(v)}" target="_blank" rel="noopener">${esc(v)}</a>` : '—';
    else txt = v == null ? '—' : (c.f ? c.f(v) : esc(v));
    const cls = (i === 0 || c.left ? 'l ' : '') + (c.name ? 'name ' : '') + (c.heat ? 'heat ' : '') + (c.k === 'ctr' ? 'pk' : '');
    const style = c.heat && v ? ` style="background-image:linear-gradient(90deg,var(--heat) ${(v / max[c.k] * 100).toFixed(1)}%,transparent ${(v / max[c.k] * 100).toFixed(1)}%)"` : '';
    return `<td class="${cls}"${style}${c.name ? ` title="${esc(v)}"` : ''}>${txt}</td>`;
  };
  const body = rows.map(r => `<tr>${t.cols.map((c, i) => cell(c, r, i)).join('')}</tr>`).join('');
  const foot = t.total ? `<tfoot><tr>${t.cols.map((c, i) => { const v = t.total[c.k]; return `<td class="${i === 0 || c.left ? 'l' : ''}">${v == null ? '' : (c.f && typeof v === 'number' ? c.f(v) : esc(v))}</td>`; }).join('')}</tr></tfoot>` : '';
  el.innerHTML = `<div class="tw"><table><thead><tr>${head}</tr></thead><tbody>${body}</tbody>${foot}</table></div>`;
}

/* ============ Conexión con Google Sheets ============ */
function extractSheetId(u) {
  if (/\/d\/e\//.test(u)) return { error: "Pegaste el link de 'Publicar en la web' (/d/e/...). Pegá el link normal de la hoja (el que termina en /edit)." };
  const m = u.match(/\/d\/([a-zA-Z0-9-_]{20,})/); if (m) return { id: m[1] };
  if (/^[a-zA-Z0-9-_]{25,}$/.test(u.trim())) return { id: u.trim() };
  return { error: 'URL inválida. Pegá el link completo de Google Sheets.' };
}
function jsonp(id, tab) {
  return new Promise((resolve, reject) => {
    const cb = '__gv_' + Math.random().toString(36).slice(2), s = document.createElement('script'); let done = false;
    const fail = (m) => { if (done) return; done = true; delete window[cb]; s.remove(); const e = new Error(m); e.tab = tab; reject(e); };
    const timer = setTimeout(() => fail('PRIVATE'), 15000);
    window[cb] = (resp) => {
      if (done) return; done = true; clearTimeout(timer); delete window[cb]; s.remove();
      if (!resp || resp.status !== 'ok') { const e = new Error('HTTP_' + ((resp && resp.errors && resp.errors[0] && resp.errors[0].reason) || 'error')); e.tab = tab; return reject(e); }
      const cols = resp.table.cols.map(c => c.label || c.id);
      resolve(resp.table.rows.map(r => { const o = {}; cols.forEach((n, i) => { const c = r.c[i]; if (!c || c.v == null) { o[n] = ''; return; }
        if (typeof c.v === 'string' && /^Date\(/.test(c.v)) o['__d_' + n] = parseDate(c.v);
        o[n] = typeof c.v === 'number' ? c.v : (c.f != null ? c.f : String(c.v)); }); return o; }));
    };
    s.onerror = () => { clearTimeout(timer); fail('PRIVATE'); };
    s.src = `https://docs.google.com/spreadsheets/d/${id}/gviz/tq?headers=1&tqx=responseHandler:${cb}&sheet=${encodeURIComponent(tab)}`;
    document.head.appendChild(s);
  });
}
async function csv(id, tab) {
  let res;
  try { res = await fetch(`https://docs.google.com/spreadsheets/d/${id}/gviz/tq?tqx=out:csv&sheet=${encodeURIComponent(tab)}`, { cache: 'no-store' }); }
  catch (e) { return jsonp(id, tab); }
  if (!res.ok) { const e = new Error('HTTP_' + res.status); e.tab = tab; throw e; }
  const text = await res.text();
  if (/^\s*<(!doctype|html)/i.test(text)) { const e = new Error('PRIVATE'); e.tab = tab; throw e; }
  return Papa.parse(text, { header: true, skipEmptyLines: true }).data;
}
function explain(err) {
  if (err.message === 'PRIVATE') return 'Google no dejó leer la hoja porque es privada. En el Sheet: Compartir → Acceso general → «Cualquier persona con el enlace» → Lector. Después volvé a conectar.';
  if (err.message === 'NODATA') return 'La hoja se leyó, pero ninguna pestaña de plataforma (Meta, GoogleAds, TikTok, DV360) tiene filas con Fecha e Impresiones. Revisá nombres de pestañas y columnas.';
  if (err.message.startsWith('HTTP_')) return `Google respondió con error (${err.message.replace('HTTP_', '')}) al leer la pestaña «${err.tab}».`;
  return err.message;
}
function status(msg, bad) { const e = $('status'); if (!e) return; e.textContent = msg; e.className = bad ? 'err' : 'ok'; }
function afterLoad(label) {
  $('filters').classList.remove('hidden'); $('main').classList.remove('hidden');
  const n = new Date(), hm = `${n.getHours()}:${p2(n.getMinutes())}`;
  const up = $('updated'); up.classList.remove('hidden');
  up.textContent = label === 'demo' ? 'Datos demo' : `Sincronizado hoy a las ${hm}`;
  const cli = S.cfg.cliente || 'Cliente', logo = S.cfg.logocliente || LOGOS[key(cli)] || '';
  const nameH1 = `<h1 id="clientName">${esc(cli)}</h1>`;
  $('clientBrand').innerHTML = (logo
    ? `<img src="${esc(logo)}" alt="${esc(cli)}" onerror="this.outerHTML=${esc(JSON.stringify(nameH1))}">`
    : nameH1) + `<p id="campaignInfo"></p>`;
  document.title = `${cli} · Reporte de medios · LSIX`;
  const h = (location.hash || '').slice(1); if (h === 'overview' || PLATS[h]) S.tab = h; else S.tab = 'overview';
  render();
}
async function loadSheet(id) {
  $('loading').classList.remove('hidden');
  try {
    const opt = (t) => csv(id, t).catch(() => []);
    const names = ['Config', 'Presupuestos', 'Meta', 'GoogleAds', 'GoogleAds_Conv', 'TikTok', 'DV360'];
    const first = csv(id, 'Config').catch(e => { if (e.message === 'PRIVATE') throw e; return []; });
    const vals = await Promise.all([first, ...names.slice(1).map(opt)]);
    const tabs = {}; names.forEach((n, i) => tabs[n] = vals[i]);
    ingest(tabs); S.source = 'sheet'; window.googleSheetId = id;
    try { localStorage.setItem('lsixSheet', id); } catch (e) {}
    status('Conectado. Datos hasta ' + fDayY(S.bounds.max) + '.', false);
    afterLoad('sheet');
  } catch (err) { console.error(err); const m = explain(err); status(m, true); if ($('adminPanel')) alert('Error de conexión:\n\n' + m); else { $('main').classList.remove('hidden'); $('main').innerHTML = `<div class="card"><div class="empty"><b class="disp" style="font-size:24px;color:var(--ink)">No se pudieron cargar los datos</b><br>Intentá nuevamente en unos minutos.</div></div>`; $('clientName').textContent = 'Reporte de medios'; } }
  finally { $('loading').classList.add('hidden'); }
}

$('btnExport')?.addEventListener('click', exportClient);

window.addEventListener('load', () => {
  let th = null; try { th = localStorage.getItem('dksTema'); } catch (e) {}
  document.documentElement.classList.toggle('dark', th === 'dark'); $('btnTema').textContent = th === 'dark' ? '☀️ Claro' : '🌙 Oscuro';
  if (window.googleSheetId) { $('adminPanel')?.remove(); loadSheet(window.googleSheetId); }
  else { $('clientName').textContent = 'Esperando conexión...'; $('campaignInfo').textContent = 'Conectá tu hoja para visualizar los datos'; try { const s = localStorage.getItem('lsixSheet'); if (s) $('sheetUrl').value = 'https://docs.google.com/spreadsheets/d/' + s + '/edit'; } catch (e) {} }
});
</script></body></html>
